<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTOKBANG MUSIC</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent-color: #ff5722;
            --text-color: #ffffff;
            --text-secondary: #9e9eb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 16px 0;
            gap: 8px;
        }
        .admin-link-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-link-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Header */
        .header {
            padding: 10px 20px 10px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Main View Container */
        .main-view {
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .display-container {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            background: #2a2a38;
            position: relative;
        }

        .album-art-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .album-art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .view-panel {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .view-panel.hidden {
            display: none;
        }

        .lyrics-panel-bg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
        }
        .lyrics-overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(15, 15, 19, 0.85);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            text-align: center;
            align-items: center;
            justify-content: flex-start;
        }

        .lyrics-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-color);
            white-space: pre-wrap;
            word-break: break-all;
            width: 100%;
        }

        .track-info {
            position: relative;
        }
        .track-info h2 {
            font-size: 1.3rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .lyrics-toggle-btn {
            background: #2a2a38;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .lyrics-toggle-btn:hover {
            color: #fff;
            background: var(--accent-color);
        }

        /* Player Controls */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #333345;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.1s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }
        .btn:active { transform: scale(0.9); }
        
        .btn-play {
            width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 50%;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.4);
        }
        
        .btn-mode {
            font-size: 1.1rem;
            background: #2a2a38;
            border-radius: 50%;
            color: var(--text-secondary);
        }
        .btn-mode:hover {
            color: #fff;
            background: #3a3a4f;
        }
        .btn-mode.active {
            color: var(--accent-color);
            background: rgba(255, 87, 34, 0.15);
        }

        /* Playlist */
        .playlist-section {
            background: #15151c;
            padding: 20px;
            border-top: 1px solid #2a2a38;
        }
        .playlist-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .playlist {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }
        .playlist li:hover {
            background: rgba(255,255,255,0.05);
        }
        .playlist li.active {
            background: rgba(255, 87, 34, 0.15);
            color: var(--accent-color);
        }
        .track-actions {
            display: flex;
            gap: 6px;
        }
        .action-btn {
            background: #2a2a38;
            border: none;
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .action-btn:hover {
            background: var(--accent-color);
        }
        .action-btn.btn-delete {
            background: #4a1f1f;
            color: #ff8888;
        }
        .action-btn.btn-delete:hover {
            background: #cc2e2e;
            color: #fff;
        }

        /* MV Modal */
        #mv-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .mv-screen {
            width: 90%;
            max-width: 400px;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        .mv-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .mv-screen img.active {
            opacity: 1;
        }
        .close-mv {
            margin-top: 20px;
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-card h3 {
            margin-bottom: 16px;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #15151c;
            border: 1px solid #333345;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit {
            background: var(--accent-color);
            color: #fff;
        }
        .btn-cancel {
            background: #333345;
            color: var(--text-secondary);
        }
        .file-upload-info {
            font-size: 0.75rem;
            color: #f39c12;
            margin-top: 4px;
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.1rem;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div>⏳ 서버와 동기화 중입니다...</div>
    </div>

    <div class="container">
        <div class="top-bar">
            <button class="admin-link-btn" onclick="openAdminCheck()">⚙️ 운영진 곡 등록/관리</button>
        </div>

        <div class="header">
            <h1>OTOKBANG MUSIC</h1>
            <p>1ST ALBUM : 오늘도 우리 방은 난리야</p>
        </div>

        <div class="main-view">
            <div class="display-container">
                <div class="view-panel" id="art-panel">
                    <div class="album-art-container">
                        <img id="current-art" src="" alt="Album Art">
                    </div>
                </div>

                <div class="view-panel hidden" id="lyrics-panel">
                    <div class="lyrics-panel-bg" id="lyrics-bg">
                        <div class="lyrics-overlay">
                            <div class="lyrics-text" id="lyrics-content">등록된 가사가 없습니다.</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="track-info">
                <h2 id="track-title">곡을 선택해주세요</h2>
                <p id="album-name">OTOKBANG 1ST ALBUM</p>
                <button class="lyrics-toggle-btn" id="lyrics-toggle-btn" onclick="toggleLyricsView()">📜 가사 보기</button>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="btn btn-mode" id="mode-btn" onclick="togglePlayMode()" title="재생 모드">➡️</button>
                <button class="btn" onclick="prevTrack()" title="이전 곡">⏮</button>
                <button class="btn btn-play" id="play-btn" onclick="togglePlay()" title="재생/일시정지">▶</button>
                <button class="btn" onclick="nextTrack()" title="다음 곡">⏭</button>
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-title">Track List</div>
            <ul class="playlist" id="playlist">
                <!-- 동적 렌더링 -->
            </ul>
        </div>
    </div>

    <!-- MV Modal -->
    <div id="mv-modal">
        <div class="mv-screen" id="mv-screen"></div>
        <button class="close-mv" onclick="closeMV()">자켓 닫기</button>
    </div>

    <!-- Password Modal -->
    <div class="modal-overlay" id="password-modal">
        <div class="modal-card">
            <h3>🔒 운영진 인증</h3>
            <div class="form-group">
                <label>비밀번호를 입력하세요</label>
                <input type="password" id="admin-pw" placeholder="비밀번호">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">취소</button>
                <button class="btn-submit" onclick="verifyPassword()">확인</button>
            </div>
        </div>
    </div>

    <!-- File Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal-card">
            <h3>🎵 새 곡 등록 (오디오 URL + 자켓 이미지)</h3>
            <div class="form-group">
                <label>곡 제목</label>
                <input type="text" id="upload-title" placeholder="예: 오늘도 우리 방은 난리야">
            </div>
            <div class="form-group">
                <label>앨범 이름</label>
                <input type="text" id="upload-album" value="OTOKBANG 1ST ALBUM">
            </div>
            <div class="form-group">
                <label>오디오 파일 주소 (구글 드라이브 링크 등)</label>
                <input type="text" id="upload-audio-url" placeholder="구글 드라이브 공유 링크 붙여넣기">
                <div class="file-upload-info">💡 구글 드라이브 링크를 넣으면 자동으로 재생 링크로 변환됩니다!</div>
            </div>
            <div class="form-group">
                <label>앨범 자켓 이미지 파일 선택 (.jpg, .png 등)</label>
                <input type="file" id="upload-cover-file" accept="image/*">
            </div>
            <div class="form-group">
                <label>가사 (선택사항)</label>
                <textarea id="upload-lyrics" placeholder="가사를 입력하세요..."></textarea>
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">취소</button>
                <button class="btn-submit" onclick="addTrackToServer()">등록하기</button>
            </div>
        </div>
    </div>

    <!-- Audio Player -->
    <audio id="audio-player"></audio>

    <script>
        const BIN_ID = "6aa11230ffd5d16053f09481"; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const MASTER_KEY = "$2a$10$t5FzUrdNjw.YZiuqqdrpJ.rJu.BMhFGvbY7iBLIckcr.czqCwAC/W";

        const defaultTracks = [
            {
                title: "오늘도 우리 방은 난리야 (기본 샘플)",
                album: "OTOKBANG 1ST ALBUM",
                lyrics: "오늘도 우리 방은 난리야~\n아무도 우리를 막을 수 없지!",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60",
                mvImages: [
                    "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60"
                ]
            }
        ];

        let tracks = [];
        let currentTrackIndex = 0;
        let playMode = 'sequential'; 
        let isAdminLoggedIn = false;
        let isLyricsShowing = false;

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const titleEl = document.getElementById('track-title');
        const albumEl = document.getElementById('album-name');
        const artEl = document.getElementById('current-art');
        const lyricsBgEl = document.getElementById('lyrics-bg');
        const lyricsContentEl = document.getElementById('lyrics-content');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playlistEl = document.getElementById('playlist');
        const modeBtn = document.getElementById('mode-btn');
        const loadingOverlay = document.getElementById('loading-overlay');

        const ADMIN_PASSWORD = "1234";

        async function fetchTracksFromServer() {
            try {
                const response = await fetch(API_URL, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.record && Array.isArray(data.record.tracks)) {
                        tracks = data.record.tracks;
                    } else {
                        tracks = defaultTracks;
                    }
                } else {
                    tracks = defaultTracks;
                }
            } catch (e) {
                tracks = defaultTracks;
            }
            renderPlaylist();
            if (tracks.length > 0 && !audio.src) loadTrack(0);
        }

        async function saveTracksToServer() {
            loadingOverlay.style.display = 'flex';
            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ tracks: tracks })
                });
                if (!response.ok) {
                    alert("서버 저장 중 오류가 발생했습니다.");
                }
            } catch (e) {
                alert("서버 연결에 실패했습니다.");
            }
            loadingOverlay.style.display = 'none';
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            if (tracks.length === 0) {
                playlistEl.innerHTML = '<li style="justify-content:center; color:var(--text-secondary);">등록된 곡이 없습니다.</li>';
                return;
            }

            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                if (index === currentTrackIndex) li.classList.add('active');
                
                let deleteBtnHtml = isAdminLoggedIn ? `<button class="action-btn btn-delete" onclick="event.stopPropagation(); deleteTrack(${index})">🗑️ 삭제</button>` : '';

                li.innerHTML = `
                    <span>0${index + 1}. ${track.title}</span>
                    <div class="track-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); loadAndPlay(${index})">▶ 듣기</button>
                        <button class="action-btn" onclick="event.stopPropagation(); openMV(${index})">🎬 자켓</button>
                        ${deleteBtnHtml}
                    </div>
                `;
                li.onclick = () => loadAndPlay(index);
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            if (tracks.length === 0) return;
            currentTrackIndex = index;
            const track = tracks[index];
            audio.src = track.src;
            titleEl.innerText = track.title;
            albumEl.innerText = track.album;
            artEl.src = track.cover || "";
            lyricsBgEl.style.backgroundImage = `url('${track.cover || ""}')`;
            lyricsContentEl.innerText = track.lyrics || "등록된 가사가 없습니다.";
            renderPlaylist();
        }

        function loadAndPlay(index) {
            loadTrack(index);
            audio.play().catch(e => console.log("자동재생 제한:", e));
            playBtn.innerText = "⏸";
        }

        function togglePlay() {
            if (tracks.length === 0) return;
            if (audio.paused) {
                if (!audio.src) loadTrack(0);
                audio.play();
                playBtn.innerText = "⏸";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
            }
        }

        function nextTrack() {
            if (tracks.length === 0) return;
            if (playMode === 'shuffle') {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * tracks.length);
                } while (nextIdx === currentTrackIndex && tracks.length > 1);
                currentTrackIndex = nextIdx;
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            }
            loadAndPlay(currentTrackIndex);
        }

        function prevTrack() {
            if (tracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadAndPlay(currentTrackIndex);
        }

        function togglePlayMode() {
            if (playMode === 'sequential') {
                playMode = 'repeat-one';
                modeBtn.innerText = "🔂";
                modeBtn.classList.add('active');
            } else if (playMode === 'repeat-one') {
                playMode = 'shuffle';
                modeBtn.innerText = "🔀";
                modeBtn.classList.add('active');
            } else {
                playMode = 'sequential';
                modeBtn.innerText = "➡️";
                modeBtn.classList.remove('active');
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (playMode === 'repeat-one') {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if(duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function toggleLyricsView() {
            isLyricsShowing = !isLyricsShowing;
            const artPanel = document.getElementById('art-panel');
            const lyricsPanel = document.getElementById('lyrics-panel');
            const toggleBtn = document.getElementById('lyrics-toggle-btn');

            if (isLyricsShowing) {
                artPanel.classList.add('hidden');
                lyricsPanel.classList.remove('hidden');
                toggleBtn.innerText = "💿 앨범 자켓 보기";
            } else {
                artPanel.classList.remove('hidden');
                lyricsPanel.classList.add('hidden');
                toggleBtn.innerText = "📜 가사 보기";
            }
        }

        function deleteTrack(index) {
            if (confirm(`"${tracks[index].title}" 곡을 삭제하시겠습니까?`)) {
                tracks.splice(index, 1);
                saveTracksToServer();
                
                if (tracks.length === 0) {
                    audio.pause();
                    audio.src = "";
                    titleEl.innerText = "등록된 곡이 없습니다";
                    albumEl.innerText = "";
                    artEl.src = "";
                    lyricsBgEl.style.backgroundImage = "";
                    lyricsContentEl.innerText = "";
                } else if (currentTrackIndex >= tracks.length) {
                    currentTrackIndex = tracks.length - 1;
                    loadTrack(currentTrackIndex);
                } else {
                    renderPlaylist();
                }
                alert("곡이 삭제되었습니다.");
            }
        }

        function openMV(index) {
            const track = tracks[index];
            const mvScreen = document.getElementById('mv-screen');
            mvScreen.innerHTML = '';

            const images = track.mvImages && track.mvImages.length > 0 ? track.mvImages : [track.cover];

            images.forEach((imgSrc, i) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                if (i === 0) img.classList.add('active');
                mvScreen.appendChild(img);
            });

            document.getElementById('mv-modal').style.display = 'flex';
        }

        function closeMV() {
            document.getElementById('mv-modal').style.display = 'none';
        }

        function openAdminCheck() {
            if (isAdminLoggedIn) {
                document.getElementById('upload-modal').style.display = 'flex';
            } else {
                document.getElementById('password-modal').style.display = 'flex';
            }
        }

        function closeModals() {
            document.getElementById('password-modal').style.display = 'none';
            document.getElementById('upload-modal').style.display = 'none';
            document.getElementById('admin-pw').value = '';
            document.getElementById('upload-audio-url').value = '';
            document.getElementById('upload-cover-file').value = '';
        }

        function verifyPassword() {
            const pw = document.getElementById('admin-pw').value;
            if (pw === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById('password-modal').style.display = 'none';
                document.getElementById('admin-pw').value = '';
                document.getElementById('upload-modal').style.display = 'flex';
                renderPlaylist();
            } else {
                alert("비밀번호가 틀렸습니다!");
            }
        }

        function convertDriveUrl(url) {
            // 구글 드라이브 공유 링크인 경우 직접 다운로드/재생 링크로 변환
            let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://docs.google.com/uc?export=download&id=${match[1]}`;
            }
            match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://docs.google.com/uc?export=download&id=${match[1]}`;
            }
            return url;
        }

        function addTrackToServer() {
            let title = document.getElementById('upload-title').value.trim();
            let album = document.getElementById('upload-album').value.trim();
            let rawAudioUrl = document.getElementById('upload-audio-url').value.trim();
            let coverFile = document.getElementById('upload-cover-file').files[0];
            let lyrics = document.getElementById('upload-lyrics').value.trim();

            if (!title || !rawAudioUrl) {
                alert("곡 제목과 오디오 파일 주소는 필수입니다!");
                return;
            }

            let audioUrl = convertDriveUrl(rawAudioUrl);
            loadingOverlay.style.display = 'flex';
            let defaultCover = "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60";

            if (coverFile) {
                const coverReader = new FileReader();
                coverReader.onload = function(coverEvent) {
                    const coverBase64 = coverEvent.target.result;
                    saveNewTrackData(title, album, audioUrl, coverBase64, lyrics);
                };
                coverReader.readAsDataURL(coverFile);
            } else {
                saveNewTrackData(title, album, audioUrl, defaultCover, lyrics);
            }
        }

        function saveNewTrackData(title, album, audioSrc, coverSrc, lyrics) {
            const newTrack = {
                title: title,
                album: album || "OTOKBANG 1ST ALBUM",
                lyrics: lyrics,
                src: audioSrc,
                cover: coverSrc,
                mvImages: [coverSrc]
            };

            tracks.push(newTrack);
            saveTracksToServer().then(() => {
                closeModals();
                alert("새 곡이 서버에 등록되어 동기화되었습니다! 🎉");
                loadAndPlay(tracks.length - 1);
            });
        }

        fetchTracksFromServer();
    </script>
</body>
</html>
